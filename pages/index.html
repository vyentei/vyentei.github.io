<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Vyentei Fonts</title>
    <link rel="icon" href="icon.png">
    <style>
      @font-face {
        font-family: "Vyentei";
        font-weight: normal;
        font-style: normal;
        src: url("https://vyentei.org/fonts/Vyentei.woff") format("woff"),
             url("https://vyentei.org/fonts/Vyentei.ttf") format("truetype");
      }

      @font-face {
        font-family: "Vyentei";
        font-weight: normal;
        font-style: italic;
        src: url("https://vyentei.org/fonts/Vyentei-Oblique.woff") format("woff"),
             url("https://vyentei.org/fonts/Vyentei-Oblique.ttf") format("truetype");
      }

      html {
        font-family: "Vyentei";
        font-weight: normal;
        font-style: normal;
        overflow-x: hidden;
        overflow-wrap: break-word;
      }

      body {
        background-color: #030D0E;
        color: #000;
        padding: 0;
        margin: 0;
        border: 0;
      }

      main {
        background-color: #99D0B0;
        color: #000;
        margin: auto;
        margin-top: 12pt;
        margin-bottom: 15pt;
        border: 0;
        border-radius: 15pt;
        box-shadow: inset 0 0 0 5pt #484848;
        padding-top: 5pt;
        padding-left: 0pt;
        padding-right: 0pt;
        padding-bottom: 20pt;
        width: 100%;
        max-width: 1250px;
      }
      
      p, ul, li, h1, h2, h3, h4, h5, h6 {
        margin-left: 15pt;
        margin-right: 15pt;
      }

      p, ul, li {
        font-size: 14pt;
      }

      h6 {
        font-size: 14pt;
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 4pt;
        padding: 0;
      }

      h5 {
        font-size: 24pt;
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 4pt;
        padding: 0;
      }

      h4 {
        font-size: 34pt;
        font-weight: normal;
        margin-top: 0;
        margin-bottom: 4pt;
        padding: 0;
      }

      h3 {
        font-size: 22pt;
      }

      h2 {
        font-size: 24pt;
      }

      h1 {
        font-size: 26pt;
      }

      textarea {
        width: 100%;
        font-size: 15pt;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import init, {} from './web.js';
      init("./web_bg.wasm");
    </script>
  </body>
</html>
